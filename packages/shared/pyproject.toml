[project]
name = "northstar-shared"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pyjwt[crypto]>=2.9", "pydantic>=2.9", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar_shared"]
