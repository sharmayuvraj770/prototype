[project]
name = "seedgen"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["northstar-shared", "psycopg[binary]>=3.2", "cryptography"]

[tool.uv.sources]
northstar-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seedgen"]
