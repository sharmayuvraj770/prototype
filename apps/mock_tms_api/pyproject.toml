[project]
name = "mock-tms-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "northstar-shared",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.5",
]

[tool.uv.sources]
northstar-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_tms_api"]
