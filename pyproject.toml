[project]
name = "northstar-tms"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff", "northstar-shared", "seedgen", "mock-tms-api", "mcp-server", "asgi-lifespan"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
northstar-shared = { workspace = true }
seedgen = { workspace = true }
mock-tms-api = { workspace = true }
mcp-server = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
